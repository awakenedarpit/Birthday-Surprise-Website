<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff0e8">
  <title>Birthday Surprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <div id="setupView" class="view">
      <header class="top">
        <div class="progress" id="progress"></div>
        <button class="sound" id="soundBtn" aria-label="Toggle sound">🔊</button>
      </header>
      <main class="setup-card">
        <div class="step-label" id="stepLabel"></div>
        <section id="stepContent"></section>
      </main>
    </div>

    <div id="previewView" class="view preview hidden">
      <header class="preview-top">
        <button class="back-preview" id="previewBack">← Back</button>
        <div class="preview-badge">👁️ &nbsp; PREVIEW MODE</div>
        <button class="sound ghost" id="soundBtn2">🔊</button>
      </header>
      <main id="previewContent"></main>
    </div>
  </div>

  <input id="photoInput" type="file" accept="image/png,image/jpeg" multiple hidden>
  <div id="toast"></div>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
